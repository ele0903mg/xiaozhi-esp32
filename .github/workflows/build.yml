name: Build Relay Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build doit-s3-aibox relay firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python scripts/build.py doit-s3-aibox --name doit-s3-aibox --language zh-CN

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: relay-firmware
          path: build/merged-binary.bin
          if-no-files-found: error
